
{$widgetId = implode(["pl-wigdet-", waString::uuid()])}

<iframe
        class="pl-widget"
        id="{$widgetId}"
        src="{$wa_backend_url}pocketlists/widget/dashboard/?widget_id={$widgetId}"
        frameborder="0"
        scrolling="no"
        style="width: 100%; border: 0; display: block;"
        loading="lazy"
></iframe>

<script>
if (!window.__plWidgetHandlerLoaded) {
  window.__plWidgetHandlerLoaded = true;
  const script = document.createElement('script');
  script.src = '{$wa_app_static_url}js/pocketlists-widget.js';
  document.head.appendChild(script);
}
</script>
